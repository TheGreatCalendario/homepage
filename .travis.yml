dist: jammy
language: node_js
cache:
  directories:
    - node_modules
    - bower_components
node_js:
  - '20'
before_script:
  - 'npm install -g bower grunt-cli'
  - 'bower install'
script:
  - 'npm run-script test'
  - 'npm run-script build'
addons:
  chrome: stable
deploy:
  provider: pages
  skip-cleanup: true
  github-token: $GITHUB_TOKEN  # Set in the settings page of your repository, as a secure variable
  keep-history: false
  local-dir: dist
  on:
    branch: master
